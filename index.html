<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDoList</title>
    <link rel="stylesheet" href="./todo.css" />
  </head>
  <body>
    <main>
      <h1>ToDo List</h1>

      <div class="input-btn-lists">
        <div class="input-btn">
          <input id="inputBox" placeholder="Add Item" autofocus type="text" />
          <input id="addBtn"  type="button" value="Add" />
        </div>

        <div class="lists-clearBtn">
          <input id="clearAllBtn" type="button" value="Clear All">
          <ul class="lists">
          </ul>

        </div>
      </div>
    </main>

    <script src="./todo.js"></script>
  </body>
</html>
